name: Deploy admin to CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role, no stored AWS keys
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

# Repository settings -> Secrets and variables -> Actions:
#   Variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#   Secret:    MAIN_ENV_FILE (the Vite .env, e.g. VITE_API_URL=https://<backend-ip>)
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write .env from secret
        env:
          MAIN_ENV_FILE: ${{ secrets.MAIN_ENV_FILE }}
        run: |
          printf '%s\n' "$MAIN_ENV_FILE" | sed 's/\r$//' > .env
          grep -q '^VITE_API_URL=' .env || { echo "::error::MAIN_ENV_FILE must define VITE_API_URL"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Vite puts content-hashed files in dist/assets: cache them for a year.
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
              --cache-control "public,max-age=31536000,immutable"
          fi
          # Everything else (index.html, public/ files) must always be revalidated.
          aws s3 sync dist "s3://$S3_BUCKET" --exclude "assets/*" \
            --cache-control "no-cache"
          # Remove files that are no longer part of the build.
          aws s3 sync dist "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$ID"
          echo "Deployed. Invalidation $ID complete." >> "$GITHUB_STEP_SUMMARY"
